[package]
name = "rooms"
version = "0.1.0"
edition = "2021"
description = "Kashu rooms: friends save together; streaks, tickets and the weekly draw run on a MagicBlock Ephemeral Rollup and settle on Solana."

[lib]
crate-type = ["cdylib", "lib"]
name = "rooms"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# a 10-minute week, so a whole week and its draw can be watched on devnet
devnet = []

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = { workspace = true, features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.17.0", features = ["anchor", "vrf", "access-control"] }
vault = { path = "../vault", features = ["cpi"] }
